<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.12 0.72" numOctaves="2" seed="23" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="0.4" exponent="2" offset="0.6"/>
      <feFuncG type="gamma" amplitude="0.4" exponent="2" offset="0.6"/>
      <feFuncB type="gamma" amplitude="0.4" exponent="2" offset="0.6"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#grain)"/>
</svg>
